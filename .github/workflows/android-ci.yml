name: Android CI

on:
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/buildSrc/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Determine changed files and modules
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} origin/${{ github.head_ref }} | grep -E '^(core|feature)/')
          MODULES=$(echo "$CHANGED_FILES" | sed -e 's|^([^/]+/[^/]+).*|\1|' | sed 's/\//:/g' | sort | uniq)
          FILES=$(echo "$CHANGED_FILES" | grep -vE '/test/' | grep '\.kt$')
          FILES=$(echo "$FILES" | tr '\n' ' ')
          MODULES=$(echo "$MODULES" | tr '\n' ' ')
          echo "FILES=$FILES" >> $GITHUB_ENV
          echo "MODULES=$MODULES" >> $GITHUB_ENV

      - name: Test with Gradle
        run: |
          for module in $MODULES; do
            ./gradlew :${module}:testDebugUnitTest
          done
        env:
          MODULES: ${{ env.MODULES }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/build/test-results/**/*.xml

      - name: Run KtLint
        if: ${{ env.FILES != '' }}
        uses: ScaCap/action-ktlint@master
        with:
          args: "${{ env.FILES }} '!**/test/**' '!**/Test/**'"
          github_token: ${{ secrets.TOKEN }}
          reporter: github-pr-review
          fail_on_error: false
          level: warning